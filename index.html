<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.discordapp.com; connect-src https://discord.com https://140-245-96-135.sslip.io; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>WWM Guild Hub</title>
  <meta name="description" content="Weekly raid, guild war and poll schedule for the WWM guild.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">⚔</span>
      <span>WWM Guild Hub</span>
    </div>
    <nav class="nav"><a href="./" aria-current="page">Schedule</a><a href="profile.html">My profile</a><a href="roster.html" id="nav-roster" hidden>Roster</a></nav>
    <div id="auth"></div>
  </header>

  <main>
    <section id="welcome" class="card" hidden></section>

    <section>
      <h1>This week</h1>
      <p class="muted">Times shown in <strong id="tz"></strong>. Guild times are fixed to SGT (GMT+8).</p>
      <ol id="upcoming" class="events"></ol>
    </section>

    <section>
      <h2>Weekly routine</h2>
      <div id="routine" class="grid"></div>
    </section>
  </main>

  <footer class="muted">
    Sign-ups happen in Discord via RaidHelper. Logging in reads your Discord name and server list. Only the profile page saves anything, and only what you submit there.
  </footer>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
