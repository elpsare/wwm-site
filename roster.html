<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com; connect-src https://discord.com https://140.245.96.135; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Guild Roster</title>
  <meta name="description" content="Officer view of every WWM guild member profile.">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6"></path><path d="m16 16 4 4"></path><path d="m19 21 2-2"></path></svg>
      <span>WWM Guild Hub</span>
    </div>
    <nav class="nav"><a href="./">Schedule</a><a href="profile.html">My profile</a><a href="roster.html" id="nav-roster" aria-current="page">Roster</a></nav>
    <div id="auth"></div>
  </header>

  <main>
    <h1>Guild roster</h1>
    <p class="muted">Every member's profile. Only officers can open this page. Everyone else can only see their own profile.</p>
    <section id="status" class="card"></section>

    <div id="tools" class="tools" hidden>
      <input id="q" type="search" placeholder="Search name, IGN or weapon" aria-label="Search">
      <select id="interest" aria-label="Interest">
        <option value="">All interests</option>
        <option value="gvg">Guild War (GvG)</option>
        <option value="pve">Skyward Bond / Speedruns</option>
        <option value="social">Casual / Social</option>
      </select>
      <select id="state" aria-label="Status">
        <option value="">Complete or not</option>
        <option value="done">Complete</option>
        <option value="todo">Incomplete</option>
        <option value="gone">Left the server</option>
      </select>
    </div>
    <p id="count" class="muted"></p>
    <div id="roster" class="roster"></div>
  </main>

  <footer class="muted">
    Read-only. Officers edit someone else's profile in Discord with <code>/profile edit</code>.
  </footer>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="roster.js"></script>
</body>
</html>
